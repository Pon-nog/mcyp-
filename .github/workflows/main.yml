name: Miniso Auto Tasks

on:
  schedule:
    - cron: '0 12 * * 4'
  workflow_dispatch:

jobs:
  run-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Miniso Script
      env:
        MINISO_RAW_HEADERS: ${{ secrets.MINISO_RAW_HEADERS }}
        MINISO_RAW_HEADERS_1: ${{ secrets.MINISO_RAW_HEADERS_1 }}
        MINISO_RAW_HEADERS_2: ${{ secrets.MINISO_RAW_HEADERS_2 }}
      run: |
        echo "=== 步骤: 运行名创优品自动化脚本 ==="
        echo "当前模式: 直连（暂未启用代理）"
        echo ""
        echo "账号数量:"
        env | grep -c "MINISO_RAW_HEADERS" || echo "0"
        python mcyp_browse.py

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: miniso-logs-${{ github.run_number }}
        path: |
          *.log
        retention-days: 7
